# Build and test SnipSnap on every pull request and on main. No secrets,
# read-only token, GitHub-owned actions pinned by commit, GitHub-hosted runners.
name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Build packages against the supported Ubuntu 26.04 distribution.
    container: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Container prerequisites
        run: apt-get update -q && apt-get install -q -y git ca-certificates sudo
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y --no-install-recommends \
            build-essential cmake ninja-build dbus-daemon libgl-dev libglib2.0-bin python3 \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-svg-dev qt6-l10n-tools debhelper
      # Qt-Color-Widgets and KDSingleApplication are fetched by CMake at pinned commits.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON \
            -DDISABLE_UPDATE_CHECKER=ON \
            -DENABLE_IMGUR=OFF \
            -DENABLE_GNOME_SHELL_BRIDGE=ON \
            -DSNIPSNAP_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Build Debian candidate from the public tree
        run: |
          cp -a packaging/debian debian
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../snipsnap_*.deb dist/
          cd dist && sha256sum *.deb > SHA256SUMS.txt
      - name: Verify packaged install on Ubuntu 26.04
        run: |
          sudo apt-get install -q -y --no-install-recommends ./dist/*.deb
          QT_QPA_PLATFORM=offscreen snipsnap --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snipsnap-debian-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14

  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # gjs_shell_bridge_handoff_test.py imports gi at module level; the GObject
      # bindings only exist for the system python3, which is what runs pytest.
      - run: sudo apt-get update -q && sudo apt-get install -q -y --no-install-recommends python3-gi
      - run: pip install -q pytest pillow
      # Tree-level tests; the ones that need a GNOME session or a built binary skip.
      - run: python3 -m pytest -q -p no:cacheprovider tests/*_test.py

  extension-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # node:test only; the runner image ships Node (22 at the time of writing), so no setup-node.
      - run: node --test tests/*.test.mjs
        working-directory: contrib/gnome-shell-extension
